<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 500px;">
        <h2>Edit Student Details</h2>
        
        <form action="/update/{{ student.id }}" method="POST" class="form-vertical">
            <div class="form-group">
                <label>Student ID (Read-Only):</label>
                <input type="text" value="{{ student.id }}" disabled style="background-color: #eef1f6;">
            </div>

            <div class="form-group">
                <label>Name:</label>
                <input type="text" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label>Age:</label>
                <input type="number" name="age" value="{{ student.age }}" required>
            </div>

            <div class="form-group">
                <label>Course / Major:</label>
                <select name="course" required>
                    <option value="Software Engineering" {% if student.course == 'Software Engineering' %}selected{% endif %}>Software Engineering</option>
                    <option value="Business Administration" {% if student.course == 'Business Administration' %}selected{% endif %}>Business Administration</option>
                    <option value="Computer Science" {% if student.course == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                    <option value="Data Science" {% if student.course == 'Data Science' %}selected{% endif %}>Data Science</option>
                    <option value="Marketing" {% if student.course == 'Marketing' %}selected{% endif %}>Marketing</option>
                </select>
            </div>

            <div class="form-group">
                <label>Mark (0-100):</label>
                <input type="number" step="0.1" name="mark" value="{{ student.mark }}" required>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" style="background-color: #1565c0;">Save Changes</button>
                <a href="/" class="btn cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
