<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 600px; margin-top: 3rem;">
        
        <header>
            <h2>Edit Student Details</h2>
            <a href="{{ url_for('home') }}" class="btn btn-secondary">Back to Home</a>
        </header>

        <div class="card">
            <form action="{{ url_for('update_student', student_id=student.id) }}" method="POST">
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Student ID (Read Only)</label>
                    <input type="text" value="{{ student.id }}" class="form-input" disabled style="background-color: #e2e8f0; cursor: not-allowed;">
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ student.name }}" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Age</label>
                    <input type="number" name="age" value="{{ student.age }}" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Mark (0-100)</label>
                    <input type="number" step="0.1" name="mark" value="{{ student.mark }}" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Course</label>
                    <input type="text" name="course" value="{{ student.course }}" class="form-input" required>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>

            </form>
        </div>

    </div>

    <!-- Javascript File -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
